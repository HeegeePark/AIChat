name: Lint

on:
  pull_request:

jobs:
  lint:
    runs-on: macos-latest
    env:
      # 버전을 고정해 새 규칙 추가로 CI가 갑자기 깨지지 않게 한다. 올릴 때는 로컬과 함께 올린다.
      SWIFTLINT_VERSION: 0.65.1
      SWIFTFORMAT_VERSION: 0.64.6
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint & SwiftFormat
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSLf -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          unzip -oq "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          mv "$RUNNER_TEMP/swiftlint/swiftlint" "$RUNNER_TEMP/bin/"
          curl -sSLf -o "$RUNNER_TEMP/swiftformat.zip" \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip"
          unzip -oq "$RUNNER_TEMP/swiftformat.zip" -d "$RUNNER_TEMP/swiftformat"
          mv "$RUNNER_TEMP/swiftformat/swiftformat" "$RUNNER_TEMP/bin/"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/swiftlint" version
          "$RUNNER_TEMP/bin/swiftformat" --version

      - name: SwiftLint
        run: swiftlint lint --strict

      - name: SwiftFormat
        run: swiftformat --lint .
